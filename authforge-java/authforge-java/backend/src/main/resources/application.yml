spring:
  application:
    name: authforge

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/authforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:authforge}
    password: ${DB_PASSWORD:authforge_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/api/auth/oauth2/callback/{registrationId}"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-this-to-a-very-long-secret-key-in-production-minimum-256-bits}
    refresh-secret: ${JWT_REFRESH_SECRET:change-this-to-another-long-secret-key-in-production-minimum-256-bits}
    access-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}        # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000}   # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  oauth2:
    authorized-redirect-uris: ${OAUTH2_REDIRECT_URIS:http://localhost:5173/oauth2/redirect}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.authforge: INFO
    org.springframework.security: WARN
