version: "3.9"

services:

  # ── MySQL Database ─────────────────────────────────────────
  db:
    image: mysql:8.3
    container_name: authforge-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-authforge}
      MYSQL_USER:          ${DB_USERNAME:-authforge}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-authforge_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"        # remove in prod — only backend needs DB access
    networks:
      - authforge-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authforge-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:         prod
      DB_URL:                         jdbc:mysql://db:3306/${DB_NAME:-authforge}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME:                    ${DB_USERNAME:-authforge}
      DB_PASSWORD:                    ${DB_PASSWORD:-authforge_secret}
      JWT_ACCESS_SECRET:              ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:             ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXP_MS:              ${JWT_ACCESS_EXP_MS:-900000}
      JWT_REFRESH_EXP_MS:             ${JWT_REFRESH_EXP_MS:-604800000}
      GOOGLE_CLIENT_ID:               ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:           ${GOOGLE_CLIENT_SECRET:-}
      CORS_ALLOWED_ORIGINS:           ${CORS_ALLOWED_ORIGINS:-http://localhost}
      OAUTH2_REDIRECT_URIS:           ${OAUTH2_REDIRECT_URIS:-http://localhost/oauth2/redirect}
      SERVER_PORT:                    8080
    networks:
      - authforge-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── React Frontend (Nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authforge-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - authforge-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
    driver: local

networks:
  authforge-net:
    driver: bridge
